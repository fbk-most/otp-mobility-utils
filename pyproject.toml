[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otp-gdb-mobility"
version = "0.1.0"
description = "Get the travel times per transport mode around the Bologna province using OpenTripPlanner"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache License"}
authors = [{name = "fbk-most"}, {name = "Arianna Burzacchi"}]
dependencies = [
    "affine>=3.0.0",
    "annotated-types>=0.8.0",
    "attrs>=26.1.0",
    "boto3>=1.43.80",
    "botocore>=1.43.80",
    "certifi>=2026.7.22",
    "charset-normalizer>=3.5.1",
    "click>=8.4.2",
    "contextily>=1.7.1",
    "contourpy>=1.3.3",
    "cycler>=0.12.1",
    "digitalhub>=0.15.6",
    "fonttools>=4.63.0",
    "geographiclib>=2.1",
    "geopandas>=1.1.4",
    "geopy>=2.5.0",
    "gitdb>=4.0.12",
    "GitPython>=3.1.60",
    "greenlet>=3.5.5",
    "idna>=3.19",
    "jmespath>=1.1.0",
    "joblib>=1.5.3",
    "kiwisolver>=1.5.0",
    "matplotlib>=3.11.1",
    "mercantile>=1.2.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "osmium>=4.3.1",
    "packaging>=26.3",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic_core>=2.46.4",
    "pyogrio>=0.13.0",
    "pyparsing>=3.3.2",
    "pyproj>=3.7.2",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "python-slugify>=8.0.4",
    "PyYAML>=6.0.3",
    "rasterio>=1.5.1",
    "requests>=2.34.2",
    "s3transfer>=0.19.2",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "six>=1.17.0",
    "smmap>=5.0.3",
    "SQLAlchemy>=2.0.52",
    "text-unidecode>=1.3",
    "typing-inspection>=0.4.4",
    "typing_extensions>=4.16.0",
    "urllib3>=2.7.0",
    "xyzservices>=2026.3.0",
]

[project.urls]
Homepage = "https://github.com/fbk-most/otp-gdb-mobility"

[tool.setuptools.packages.find]
where = ["src"]